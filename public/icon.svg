<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#08080c"/>
  <circle cx="256" cy="256" r="156" fill="#c5e500" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Pickleball holes -->
  <g fill="#08080c">
    <circle cx="180" cy="200" r="14"/>
    <circle cx="256" cy="180" r="14"/>
    <circle cx="332" cy="200" r="14"/>
    <circle cx="200" cy="270" r="14"/>
    <circle cx="280" cy="290" r="14"/>
    <circle cx="332" cy="316" r="14"/>
    <circle cx="220" cy="340" r="14"/>
  </g>
</svg>
